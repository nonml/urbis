name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Lint
        run: npm run lint
      - name: Seeded RNG only
        run: npm run check:rng
      - name: Sim/render boundary
        run: npm run check:boundary
      - name: Content schemas
        run: npm run validate
      - name: Build
        run: npm run build

      - run: npx playwright install --with-deps chromium
      - name: Boot, draw budget, hack cascade
        run: npm test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-evidence
          path: docs/shots/gate/
          retention-days: 14
