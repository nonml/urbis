<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Neon City</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05070d; }
  #scene { position: fixed; inset: 0; display: block; }
  #vignette {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 42%, transparent 52%, rgba(2,3,8,0.55) 100%);
  }
  #hud {
    position: fixed; top: 12px; left: 12px; pointer-events: none;
    font: 12px/1.7 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #9fd8ff; text-shadow: 0 0 8px rgba(80,180,255,0.6);
    background: rgba(4,8,16,0.55); border: 1px solid rgba(120,200,255,0.25);
    padding: 8px 12px; border-radius: 6px; letter-spacing: 0.04em;
  }
  #hud b { color: #fff; font-weight: 600; }
  #hud .warn { color: #ffb14e; }
  #hint {
    position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
    font: 12px ui-monospace, Menlo, monospace; color: rgba(160,210,255,0.65);
    letter-spacing: 0.08em; pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="vignette"></div>
<div id="hud">booting…</div>
<div id="hint">wasd&nbsp;·&nbsp;move&nbsp;&nbsp;&nbsp;drag&nbsp;·&nbsp;look&nbsp;&nbsp;&nbsp;t&nbsp;·&nbsp;day/night&nbsp;&nbsp;&nbsp;h&nbsp;·&nbsp;blackout</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
