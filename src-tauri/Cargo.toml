[package]
name = "city-builder"
version = "1.0.0"
description = "City Builder Game"
authors = ["nonta"]
edition = "2021"

[lib]
name = "city_builder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "city-builder"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
