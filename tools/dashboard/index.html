<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noctune Dev Dashboard</title>
<style>
  :root { --bg: #0d1117; --card: #161b22; --border: #30363d; --text: #c9d1d9; --dim: #8b949e; --green: #3fb950; --red: #f85149; --yellow: #d29922; --blue: #58a6ff; --purple: #bc8cff; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); padding: 24px; }
  h1 { font-size: 1.5rem; margin-bottom: 8px; }
  .subtitle { color: var(--dim); font-size: 0.85rem; margin-bottom: 24px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
  .card h2 { font-size: 1rem; margin-bottom: 12px; color: var(--blue); }
  .stat { font-size: 2rem; font-weight: 700; }
  .stat-label { color: var(--dim); font-size: 0.8rem; }
  .bar-row { display: flex; align-items: center; gap: 8px; margin: 4px 0; font-size: 0.85rem; }
  .bar-label { width: 140px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar-track { flex: 1; height: 16px; background: var(--border); border-radius: 4px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 4px; transition: width 0.3s; }
  .bar-pct { width: 44px; text-align: right; color: var(--dim); font-size: 0.8rem; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 0.75rem; font-weight: 600; }
  .pill-pass { background: #1a3a2a; color: var(--green); }
  .pill-fail { background: #3a1a1a; color: var(--red); }
  .chart { display: flex; align-items: flex-end; gap: 3px; height: 80px; margin-top: 8px; }
  .chart-bar { background: var(--blue); border-radius: 2px 2px 0 0; min-width: 12px; flex: 1; position: relative; }
  .chart-bar:hover::after { content: attr(data-tip); position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); background: #000; padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; white-space: nowrap; }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  td, th { padding: 6px 8px; text-align: left; border-bottom: 1px solid var(--border); }
  th { color: var(--dim); font-weight: 500; }
  .mono { font-family: 'Cascadia Code', 'Fira Code', monospace; font-size: 0.8rem; }
  #error { color: var(--red); padding: 16px; display: none; }
</style>
</head>
<body>
<h1>Noctune Dev Dashboard</h1>
<p class="subtitle" id="generated">Loading data.json...</p>
<div id="error"></div>
<div class="grid" id="grid"></div>

<script>
async function load() {
  try {
    const res = await fetch('./data.json');
    if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
    return await res.json();
  } catch (e) {
    document.getElementById('error').style.display = 'block';
    document.getElementById('error').textContent = `Failed to load data.json: ${e.message}. Run "node tools/dashboard/collect.mjs" first.`;
    return null;
  }
}

function card(title, html) {
  return `<div class="card"><h2>${title}</h2>${html}</div>`;
}

function barRow(label, pct, color) {
  return `<div class="bar-row">
    <span class="bar-label">${label}</span>
    <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${color}"></div></div>
    <span class="bar-pct">${pct}%</span>
  </div>`;
}

function render(d) {
  document.getElementById('generated').textContent = `Generated: ${new Date(d.generatedAt).toLocaleString()}`;
  const g = document.getElementById('grid');
  let html = '';

  // 1. Milestone progress
  const cl = d.checklist;
  const totalItems = cl.done + cl.open + cl.wip;
  const donePct = totalItems ? Math.round(cl.done / totalItems * 100) : 0;
  let sectionBars = '';
  for (const [name, s] of Object.entries(cl.sections)) {
    if (s.total === 0) continue;
    const pct = Math.round(s.done / s.total * 100);
    const color = pct === 100 ? 'var(--green)' : pct > 50 ? 'var(--yellow)' : 'var(--blue)';
    sectionBars += barRow(name, pct, color);
  }
  html += card('Milestone Progress', `
    <div class="stat">${donePct}%</div>
    <div class="stat-label">${cl.done} done / ${totalItems} total (${cl.open} open)</div>
    <div style="margin-top:12px">${sectionBars}</div>
  `);

  // 2. Throughput (tasks/week)
  const tp = d.throughput || [];
  const maxCount = Math.max(...tp.map(t => t.count), 1);
  let chartBars = '';
  for (const t of tp.slice(-12)) {
    const h = Math.round(t.count / maxCount * 100);
    chartBars += `<div class="chart-bar" style="height:${h}%" data-tip="${t.week}: ${t.count}"></div>`;
  }
  const avgPerWeek = tp.length ? (tp.reduce((s, t) => s + t.count, 0) / tp.length).toFixed(1) : '0';
  html += card('Tasks / Week', `
    <div class="stat">${avgPerWeek}</div>
    <div class="stat-label">avg commits/week (last 12 weeks)</div>
    <div class="chart">${chartBars}</div>
  `);

  // 3. Revert rate
  const rv = d.reverts || {};
  const rvColor = rv.rate > 10 ? 'var(--red)' : rv.rate > 5 ? 'var(--yellow)' : 'var(--green)';
  html += card('Revert Rate', `
    <div class="stat" style="color:${rvColor}">${rv.rate}%</div>
    <div class="stat-label">${rv.reverts} reverts / ${rv.total} total commits</div>
  `);

  // 4. Avg LOC per task
  const locs = d.loc || [];
  const avgLOC = locs.length ? Math.round(locs.reduce((s, l) => s + l.insertions + l.deletions, 0) / locs.length) : 0;
  let locBars = '';
  for (const l of locs.slice(0, 12)) {
    const h = Math.min(100, Math.round((l.insertions + l.deletions) / Math.max(avgLOC * 3, 1) * 100));
    locBars += `<div class="chart-bar" style="height:${h}%" data-tip="${l.hash}: +${l.insertions} -${l.deletions}"></div>`;
  }
  html += card('Avg LOC / Task', `
    <div class="stat">${avgLOC}</div>
    <div class="stat-label">avg lines changed per commit (last 50)</div>
    <div class="chart">${locBars}</div>
  `);

  // 5. Gate health
  const gh = d.gateHealth || {};
  let gatePills = '';
  for (const [name, status] of Object.entries(gh.gates || {})) {
    const cls = status === 'pass' ? 'pill-pass' : 'pill-fail';
    gatePills += `<span class="pill ${cls}" style="margin:2px">${name}: ${status}</span> `;
  }
  html += card('Gate Health', `
    ${gatePills}
    <div style="margin-top:8px" class="stat-label">Last all-green: ${gh.lastGreen || 'never'}</div>
  `);

  // 6. Bundle size
  const bnd = d.bundle || {};
  html += card('Bundle Size', `
    <div class="stat">${bnd.totalKB} KB</div>
    <div class="stat-label">total JS+CSS in dist/assets</div>
  `);

  // 7. Screenshot heatmap (placeholder — needs diff data)
  html += card('Screenshot Baselines', `
    <div class="stat">${Object.keys(cl.sections).filter(s => s.includes('Screenshot')).reduce((n, s) => n + (cl.sections[s]?.done || 0), 0)} / 15</div>
    <div class="stat-label">baselines captured</div>
    <div class="stat-label" style="margin-top:8px">Diff heatmap available after second capture run</div>
  `);

  // 8. Top 10 ready tasks
  let taskRows = '';
  for (const t of (cl.openItems || []).slice(0, 10)) {
    taskRows += `<tr><td class="mono">${t.id}</td><td>${t.desc}</td></tr>`;
  }
  html += card('Top 10 Open Tasks', `
    <table><tr><th>ID</th><th>Description</th></tr>${taskRows || '<tr><td colspan="2">All done!</td></tr>'}</table>
  `);

  g.innerHTML = html;
}

load().then(d => { if (d) render(d); });
</script>
</body>
</html>
