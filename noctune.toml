[tool.noctune]
allow_apply = true

[tool.noctune.llm]
provider = "openai_compat"
base_url = "http://127.0.0.1:8001/v1"
model = "AesSedai/Qwen3.5-35B-A3B-GGUF:IQ4_XS"
api_key = "local"
stream = false
verbose_stream = false
stream_print_reasoning = false

[tool.noctune.llm.request_overrides]
extra_body = { chat_template_kwargs = { enable_thinking = false } }

[tool.noctune.retries]
llm_chat_max_retries = 2
base_delay_ms = 500
max_delay_ms = 5000
jitter_ratio = 0.2
